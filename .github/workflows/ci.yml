name: CI

# Runs the gates the pull-request template asks contributors to run locally.
#
# Everything here works from a plain clone on a GitHub-hosted runner: no Git LFS, no game
# files, no Metal Shader Converter and no physical GPU. The Metal 4 GPU tests, the audio
# tests and the end-to-end tests that drive a window need real Apple Silicon hardware and
# are not part of this workflow; run them locally (see CONTRIBUTING.md).
#
# Build caching has two layers:
#   - Swatinem/rust-cache restores ~/.cargo and the compiled third-party dependencies. It is
#     saved even when a later step fails, so a red run still warms the next one.
#   - sccache caches compiler output for the workspace crates, which rust-cache does not keep
#     (cargo would rebuild them regardless: a fresh checkout gives every source file a new
#     modification time). A crate is recompiled only when its sources, its dependencies or
#     the compiler change. The "Compiler cache statistics" step shows the hit rate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Keep file and line numbers in backtraces but drop full debug info: the large workspace
  # crates compile faster and their cached artifacts are much smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Overrides the empty `rustc-wrapper` in .cargo/config.toml for CI only.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit submodules, db storage, crate boundaries, tracked binaries and personal paths
        run: .agents/skills/audit-repo-hygiene/scripts/audit_repo_hygiene.sh

  test:
    name: Build and test (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Show toolchain
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version
          rustc -Vv
          cargo -V
          sccache --version
      - name: Install Zig 0.16.0 for Windows x86-64 guest tests
        working-directory: ${{ runner.temp }}
        run: |
          archive=zig-aarch64-macos-0.16.0.tar.xz
          curl --fail --location --retry 3 -o "$archive" "https://ziglang.org/download/0.16.0/$archive"
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  $archive" | shasum -a 256 -c -
          tar xf "$archive"
          compiler="$PWD/${archive%.tar.xz}/zig"
          test "$("$compiler" version)" = 0.16.0
          echo "ZIG=$compiler" >> "$GITHUB_ENV"
      - name: Catalog drift check (db/*.tsv match the source)
        run: cargo opsdb -- doctor
      - name: Build the universal runner
        run: cargo runner-build
      # The library tests and the AOT integration test run from one cargo invocation so the
      # large crates are compiled once for both. Running the AOT test on its own resolves a
      # different feature set and rebuilds win32-rt, x86-runtime and d3d12-metal.
      - name: Unit tests, AOT multi-module verification and headless Win32 guest corpus
        run: >-
          cargo factory-test --test aot_multi_module_verify --test os_guest_corpus --
          --test-threads=1 --skip shadow::tests::timeouts_and_faults
      # This test forks a child that spins forever and expects the shadow probe to report a
      # timeout. On GitHub-hosted runners it has reported a fault instead; on Apple Silicon
      # hardware it passes. It runs here so the result stays visible, but it does not gate
      # the job until the cause is understood.
      - name: Known issue on hosted runners (does not gate) - shadow timeouts_and_faults
        continue-on-error: true
        run: >-
          cargo factory-test --
          --test-threads=1 --exact shadow::tests::timeouts_and_faults
      - name: Check the Alan Wake 2 crate against shared signatures
        run: cargo check -p aw2-game --no-default-features --target aarch64-apple-darwin
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  ios:
    name: iOS library check
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the iOS target
        run: rustup target add aarch64-apple-ios
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Check the port-loader library for iOS
        run: cargo check -p port-loader --lib --no-default-features --target aarch64-apple-ios
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
