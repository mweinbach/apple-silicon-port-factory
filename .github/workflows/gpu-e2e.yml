name: GPU, Audio & E2E (Apple Silicon)

run-name: >-
  ${{
    github.event_name == 'pull_request_target' &&
    format('GPU CI: PR #{0} @ {1}', github.event.pull_request.number, github.event.pull_request.head.sha) ||
    'GPU, Audio & E2E (Apple Silicon)'
  }}

# Runs hardware-dependent Metal 4, shader toolchain, CoreAudio/WASAPI, MoltenVK,
# replay, and benchmark suites on a dedicated self-hosted Apple Silicon macOS runner.
#
# Security model (public repo + self-hosted runner):
#   - NEVER triggered automatically on pull_request opened/reopened/synchronize.
#   - Uses `pull_request_target` (`types: [labeled]`) rather than `pull_request`
#     so GitHub ALWAYS executes this workflow definition from the trusted base
#     branch (`main`) — a fork PR cannot modify this file to remove the approval
#     gate, environment protection, or SHA check.
#   - Triggered ONLY on:
#       1. `push` to `main` (already reviewed & merged),
#       2. `workflow_dispatch` on `refs/heads/main` (manual rerun of merged `main`),
#       3. `pull_request_target` `labeled` with the `gpu-ci` label, which first
#          passes through the trusted `approve-pr-gpu` gate job protected by the
#          `gpu-ci-pr` GitHub Environment (configured with runner-owner Required
#          Reviewers) and binds approval to the exact `pull_request.head.sha`
#          before any PR code is checked out on the self-hosted Mac.
#   - Minimal permissions (`contents: read`) and `persist-credentials: false` on checkout.
#   - See `docs/GPU_CI.md` for runner registration, `gpu-ci-pr` environment protection,
#     required labels, and host setup.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_bench:
        description: "Run cargo opsdb -- bench after GPU/E2E tests"
        type: boolean
        default: true
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  MTL_DEBUG_LAYER: "1"

jobs:
  # Pre-approval metadata job (runs on GitHub-hosted ubuntu-latest with zero checkout):
  # publishes the exact immutable PR commit SHA, tree SHA, and review URL to the run
  # summary BEFORE the `gpu-ci-pr` Environment pauses for runner-owner approval, and
  # verifies the live PR head has not moved since the `gpu-ci` label event.
  prepare-pr-gpu:
    name: Prepare PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'gpu-ci'
    outputs:
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      tree_sha: ${{ steps.inspect.outputs.tree_sha }}
    steps:
      - name: Record immutable PR commit & tree SHA before approval
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LIVE_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$LIVE_SHA" != "$EVENT_SHA" ]; then
            echo "ERROR: PR #${PR_NUMBER} head moved (${LIVE_SHA} != ${EVENT_SHA}); re-review and re-apply gpu-ci." >&2
            exit 1
          fi
          TREE_SHA="$(gh api "repos/${REPO}/commits/${EVENT_SHA}" --jq '.commit.tree.sha')"
          if [ -z "$TREE_SHA" ] || [ "$TREE_SHA" = "null" ]; then
            echo "ERROR: failed to resolve immutable tree SHA for ${EVENT_SHA}" >&2
            exit 1
          fi
          {
            echo "### Self-hosted GPU CI approval summary"
            echo ""
            echo "- **PR**: #${PR_NUMBER}"
            echo "- **Immutable commit SHA**: \`${EVENT_SHA}\`"
            echo "- **Immutable tree SHA**: \`${TREE_SHA}\`"
            echo "- **Inspect exact commit**: https://github.com/${REPO}/commit/${EVENT_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "head_sha=${EVENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tree_sha=${TREE_SHA}" >> "$GITHUB_OUTPUT"

  # Protected approval gate for pull requests: executed strictly from the trusted base
  # branch (`main`) via `pull_request_target` on a GitHub-hosted runner (never the
  # self-hosted Mac) inside the `gpu-ci-pr` protected Environment. Both the workflow
  # `run-name` and this job's `name` display the exact immutable commit SHA before a
  # runner owner approves deployment, preventing PR-head swap (TOCTOU) attacks.
  approve-pr-gpu:
    name: Approve PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}
    needs: [prepare-pr-gpu]
    runs-on: ubuntu-latest
    environment: gpu-ci-pr
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.prepare-pr-gpu.result == 'success'
    outputs:
      head_sha: ${{ steps.bind.outputs.head_sha }}
      tree_sha: ${{ steps.bind.outputs.tree_sha }}
    steps:
      - name: Confirm approved immutable commit SHA
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPROVED_SHA: ${{ needs.prepare-pr-gpu.outputs.head_sha }}
          APPROVED_TREE_SHA: ${{ needs.prepare-pr-gpu.outputs.tree_sha }}
        run: |
          LIVE_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$LIVE_SHA" != "$APPROVED_SHA" ]; then
            echo "ERROR: PR #${PR_NUMBER} head changed during approval (${LIVE_SHA} != ${APPROVED_SHA}); aborting." >&2
            exit 1
          fi
          echo "Approved immutable PR #${PR_NUMBER} commit ${APPROVED_SHA} (tree ${APPROVED_TREE_SHA})"
          echo "head_sha=${APPROVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "tree_sha=${APPROVED_TREE_SHA}" >> "$GITHUB_OUTPUT"

  gpu-e2e:
    name: Apple Silicon GPU, audio & E2E (MTL_DEBUG_LAYER=1)
    needs: [approve-pr-gpu]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'pull_request_target' &&
          needs.approve-pr-gpu.result == 'success' &&
          needs.approve-pr-gpu.outputs.head_sha != '' &&
          needs.approve-pr-gpu.outputs.tree_sha != '' &&
          needs.approve-pr-gpu.outputs.head_sha == github.event.pull_request.head.sha
        )
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && needs.approve-pr-gpu.outputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit & tree match approved SHAs
        if: github.event_name == 'pull_request_target'
        env:
          APPROVED_SHA: ${{ needs.approve-pr-gpu.outputs.head_sha }}
          APPROVED_TREE_SHA: ${{ needs.approve-pr-gpu.outputs.tree_sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          HEAD_TREE="$(git rev-parse 'HEAD^{tree}')"
          if [ "$HEAD_SHA" != "$APPROVED_SHA" ] || [ "$HEAD_TREE" != "$APPROVED_TREE_SHA" ]; then
            echo "ERROR: checked-out commit ${HEAD_SHA} (tree ${HEAD_TREE}) != approved ${APPROVED_SHA} (tree ${APPROVED_TREE_SHA})" >&2
            exit 1
          fi

      - name: Inspect Apple Silicon host, Metal toolchain, and optional dylibs
        id: host
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version
          rustc -Vv
          cargo -V
          if command -v zig >/dev/null 2>&1; then
            echo "zig: $(zig version) ($(command -v zig))"
          elif [ -n "${ZIG:-}" ] && [ -x "${ZIG}" ]; then
            echo "zig: $("${ZIG}" version) (${ZIG})"
          else
            echo "zig: NOT FOUND"
          fi
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcrun -sdk macosx metal --version
            echo "has_metal_toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "Xcode Metal Toolchain: NOT FOUND"
            echo "has_metal_toolchain=false" >> "$GITHUB_OUTPUT"
          fi
          for p in \
            "${METAL_IRCONVERTER_DYLIB:-}" \
            "$HOME/.local/opt/metal-shaderconverter/lib/libmetalirconverter.dylib" \
            "/usr/local/lib/libmetalirconverter.dylib" \
            "/opt/metal-shaderconverter/lib/libmetalirconverter.dylib"; do
            if [ -n "$p" ] && [ -f "$p" ]; then
              echo "libmetalirconverter: $p"
              break
            fi
          done
          for p in \
            "${PORT_DXILCONV:-}" \
            "${AW2_DXILCONV:-}" \
            "$HOME/.local/lib/libdxilconv.dylib" \
            "/opt/homebrew/lib/libdxilconv.dylib" \
            "/usr/local/lib/libdxilconv.dylib"; do
            if [ -n "$p" ] && [ -f "$p" ]; then
              echo "libdxilconv: $p"
              break
            fi
          done
          for p in \
            "${PORT_VULKAN_DYLIB:-}" \
            "/opt/homebrew/lib/libMoltenVK.dylib" \
            "/usr/local/lib/libMoltenVK.dylib" \
            "${VULKAN_SDK:-}/lib/libMoltenVK.dylib"; do
            if [ -n "$p" ] && [ -f "$p" ]; then
              echo "libMoltenVK: $p"
              break
            fi
          done

      - name: Prepare isolated run directories
        run: |
          mkdir -p "${RUNNER_TEMP}/port-aot" "${RUNNER_TEMP}/port-crash" "${RUNNER_TEMP}/translator"
          {
            echo "PORT_AOT_DIR=${RUNNER_TEMP}/port-aot"
            echo "PORT_CRASH_DIR=${RUNNER_TEMP}/port-crash"
            echo "TRANSLATOR_HOME=${RUNNER_TEMP}/translator"
          } >> "$GITHUB_ENV"

      - name: Build universal runner (port-runner)
        run: cargo runner-build

      - name: d3d12-metal library & Metal 4 GPU integration tests
        run: |
          cargo test -p d3d12-metal --lib --target aarch64-apple-darwin -- --test-threads=1
          cargo test -p d3d12-metal --target aarch64-apple-darwin \
            --test gpu_clear_resolve \
            --test gpu_mesh \
            --test gpu_rayquery \
            -- --test-threads=1

      - name: dxil-metal shader compiler & PSO archive tests
        run: >-
          cargo test -p dxil-metal --features metal --target aarch64-apple-darwin --
          --test-threads=1

      - name: Verify offline SPIR-V & WGSL .metallib compilation (when Metal toolchain present)
        if: steps.host.outputs.has_metal_toolchain == 'true'
        run: >-
          cargo test -p dxil-metal --lib --features metal --target aarch64-apple-darwin --
          spirv_to_msl_and_metallib_pipeline_works
          wgsl_to_msl_and_metallib_pipeline_works
          metal41_msl_and_spirv_options_compile_cleanly
          --test-threads=1 --nocapture

      - name: win32-rt D3D11, Vulkan (MoltenVK), and CoreAudio/WASAPI tests
        env:
          PORT_TEST_MOLTENVK: "1"
        run: >-
          cargo test -p win32-rt --lib --target aarch64-apple-darwin --
          d3d11 misc::vulkan_1 audio --test-threads=1

      - name: port-loader E2E guests (D3D11, D3D12, Vulkan)
        env:
          PORT_TEST_MOLTENVK: "1"
        run: >-
          cargo test -p port-loader --target aarch64-apple-darwin
          --test d3d11_e2e
          --test d3d12_e2e
          --test vulkan_e2e
          -- --test-threads=1

      - name: d3d12-replay Metal 4 backend & synthetic trace tests
        run: >-
          cargo test -p d3d12-replay --target aarch64-apple-darwin --
          --test-threads=1

      - name: Guest benchmark suite (cargo opsdb -- bench)
        if: github.event_name != 'workflow_dispatch' || inputs.run_bench
        run: >-
          cargo opsdb -- bench --out "${RUNNER_TEMP}/bench_results.json"
