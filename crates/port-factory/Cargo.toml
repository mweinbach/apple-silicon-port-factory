[package]
name = "port-factory"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "port-factory"
path = "src/bin/port-factory.rs"

[dependencies]
anyhow.workspace = true
bink2-codec.workspace = true
pe-image.workspace = true
port-manifest.workspace = true
dxil-metal.workspace = true
iced-x86 = { workspace = true, features = ["op_code_info"] }

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
x86-runtime.workspace = true

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
