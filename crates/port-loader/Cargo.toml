[package]
name = "port-loader"
description = "Universal native ARM64 Windows x86-64 PE loader & runtime host (`port-runner`), with optional Alan Wake 2 target (`aw2-loader`)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Default builds the lightweight universal `port-runner` binary with ZERO game-specific shards.
# Disable default features (`--no-default-features`) when embedding `libport_loader.a` on iOS
# so CLI-only `port-factory` scanner/packaging dependencies stay out of the app binary.
# Enable `aw2-core` to link hand-decompiled `aw2-game` (`ns/`) + Wwise native bridge without
# the 4.47M LOC generated shards (fast ~15s release builds backed by `.aot` caches).
# Enable `aw2` to link the full `aw2-game` (hand-decompiled `ns/` + lifted shards) + Wwise bridge.
default = ["cli"]
cli = ["dep:port-factory"]
aw2-core = ["dep:aw2-game", "aw2-game/wwise-bridge", "win32-rt/wwise-bridge"]
aw2 = ["aw2-core", "aw2-game/shards", "aw2-game/dll-shards"]

[[bin]]
name = "port-runner"
path = "src/bin/port-runner.rs"

[[bin]]
name = "aw2-loader"
path = "src/bin/aw2-loader.rs"
required-features = ["aw2-core"]

[dependencies]
anyhow.workspace = true
win64-abi.workspace = true
pe-image.workspace = true
port-manifest.workspace = true
port-factory = { workspace = true, optional = true }
d3d12-metal.workspace = true
win32-rt.workspace = true
x86-runtime.workspace = true
aw2-game = { workspace = true, optional = true }
iced-x86.workspace = true
libc.workspace = true
log.workspace = true
env_logger.workspace = true
